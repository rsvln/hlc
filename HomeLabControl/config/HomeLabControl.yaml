# HomeLabControl — единый конфиг.
# Редактируется на странице Config (/config) или руками; изменения на диске подхватываются автоматически.
# Внимание: деплой агента перезаписывает файл целиком (добавляет хост и ключи) — комментарии при этом теряются.

# ─── Настройки модулей ─────────────────────────────────────────────────────
modules:
  power:
    pingIntervalSeconds: 5
    pingTimeoutMs: 1000
    apiTimeoutSeconds: 2          # таймаут shutdown/reboot/cancel к агенту
    wolPort: 9
    broadcastAddress: 192.168.1.255
    defaultDelaySeconds: 1
    # Группы хостов: кнопки «всей группе» в Power Control, цели шагов автоматизации
    # groups:
    #   lab: [desktop, nas]
    # Ретрансляторы WoL для хостов в других подсетях (broadcast туда не доходит).
    # Хост, чей IP попал в subnet, будится через ретранслятор; самая узкая подсеть выигрывает.
    # wolRelays:
    #   - name: dacha
    #     subnet: 192.168.12.0/24
    #     type: ssh                  # шлюз (OpenWrt/Linux) с etherwake; ключ HLC ставит кнопка Setup
    #     address: 192.168.12.1
    #     sshUser: root              # по умолчанию root
    #     sshPort: 22
    #     interface: br-lan          # etherwake -i, по умолчанию br-lan
    #   - name: dacha-ha
    #     subnet: 192.168.12.0/24
    #     type: agent                # хост с агентом (2.0.11+) в той сети
    #     host: ha-dacha
    # У хоста: power: { wolVia: dacha } — явный выбор; wolVia: local — всегда broadcast из сети HLC.
  fanControl:
    apiTimeoutSeconds: 5
    updateIntervalSeconds: 2
  backup:
    settings:
      sshKeysPath: /root/.ssh
      defaultPort: 22
      defaultUser: root
      timeoutSeconds: 30
      maxParallelBackups: 3
      logPath: /var/log/backup-manager.log
      retentionDays: 14
    storages:
      - name: local
        type: local
        localPath: /srv/md0/backup
      - name: remote-server
        type: ssh
        sshHost: 192.168.1.20
        sshPort: 22
        sshUser: root
        sshKeyPath: /root/.ssh/manager_to_storage_key
        remotePath: /srv/md0/backup
    templates:
      - name: OpenWrt Full
        description: Full image + config backup
        pushCommands:
          - dd if=/dev/mmcblk0 bs=1M | gzip > /tmp/full_{{DATE}}.img.gz
          - sysupgrade -b /tmp/config_{{DATE}}.tar.gz
          # команды push выполняются на роутере — каталог на хранилище создаём по SSH
          - ssh -i {{STORAGE_KEY}} -p {{STORAGE_PORT}} {{STORAGE_USER}}@{{STORAGE_HOST}} 'mkdir -p {{STORAGE_REMOTE_PATH}}/{{HOST_NAME}}/{{DATE}}'
          - scp -i {{STORAGE_KEY}} -P {{STORAGE_PORT}} /tmp/full_{{DATE}}.img.gz {{STORAGE_USER}}@{{STORAGE_HOST}}:{{STORAGE_REMOTE_PATH}}/{{HOST_NAME}}/{{DATE}}/
          - scp -i {{STORAGE_KEY}} -P {{STORAGE_PORT}} /tmp/config_{{DATE}}.tar.gz {{STORAGE_USER}}@{{STORAGE_HOST}}:{{STORAGE_REMOTE_PATH}}/{{HOST_NAME}}/{{DATE}}/
          - rm -f /tmp/full_{{DATE}}.img.gz /tmp/config_{{DATE}}.tar.gz
        pullCommands:
          - mkdir -p {{STORAGE_REMOTE_PATH}}/{{HOST_NAME}}/{{DATE}}
          - ssh -i {{HOST_KEY}} -p {{HOST_PORT}} {{HOST_USER}}@{{HOST_IP}} 'dd if=/dev/mmcblk0 bs=1M' | gzip > {{STORAGE_REMOTE_PATH}}/{{HOST_NAME}}/{{DATE}}/full_{{DATE}}.img.gz
        retentionDays: 14

      # Основной сценарий — конфиги: хранилище вытягивает архив по SSH (pull), на хосте ничего не нужно
      - name: Linux configs
        description: /etc and docker-compose stacks
        pullCommands:
          - mkdir -p {{STORAGE_REMOTE_PATH}}/{{HOST_NAME}}/{{DATE}}
          - ssh -i {{HOST_KEY}} -p {{HOST_PORT}} {{HOST_USER}}@{{HOST_IP}} 'tar czf - /etc /opt/stacks' > {{STORAGE_REMOTE_PATH}}/{{HOST_NAME}}/{{DATE}}/configs.tar.gz
        pushCommands:
          - tar czf /tmp/configs_{{DATE}}.tar.gz /etc /opt/stacks
          - ssh -i {{STORAGE_KEY}} -p {{STORAGE_PORT}} {{STORAGE_USER}}@{{STORAGE_HOST}} 'mkdir -p {{STORAGE_REMOTE_PATH}}/{{HOST_NAME}}/{{DATE}}'
          - scp -i {{STORAGE_KEY}} -P {{STORAGE_PORT}} /tmp/configs_{{DATE}}.tar.gz {{STORAGE_USER}}@{{STORAGE_HOST}}:{{STORAGE_REMOTE_PATH}}/{{HOST_NAME}}/{{DATE}}/
          - rm -f /tmp/configs_{{DATE}}.tar.gz
        retentionDays: 30

  # Фоновый опрос агентов: статус, история температур и ресурсов (страница хоста), события для уведомлений
  monitoring:
    pollIntervalSeconds: 60
    offlineAfterFailures: 3
    smartIntervalMinutes: 30
    historyHours: 24
    # Пороги уведомлений (0 — проверка выключена); у хоста можно переопределить в hosts[].alerts
    alerts:
      diskFreePercent: 10
      ssdWearPercent: 90
      temperature: { cpu: 90, gpu: 85, storage: 55 }

  # Автоматизация: задачи по расписанию (шаги wake / waitOnline / backup / shutdown / reboot / delay)
  automation:
    tasks: []
    # - name: nightly-backup
    #   schedule: "0 3 * * *"
    #   steps:
    #     - wake: [nas]
    #     - backup: [nas]
    #     - shutdown: [nas]      # только если его разбудила эта задача (force: true — в любом случае)
    #       always: true

  # Уведомления: agentOffline, agentOnline, smart, fanProfile, temperature, diskSpace, ssdWear,
  # backupFailed, backupSuccess, automationFailed, automationSuccess
  notifications:
    events: [agentOffline, agentOnline, smart, fanProfile, temperature, diskSpace, ssdWear, backupFailed, automationFailed]
    mqtt: false                   # события в <baseTopic>/events
    telegram:
      enabled: false
      botToken: ""
      chatId: ""

  # Home Assistant через MQTT discovery (HLC — мост: опрашивает агентов и публикует устройства)
  mqtt:
    enabled: false
    host: 192.168.1.20
    port: 1883
    username: ""
    password: ""
    discoveryPrefix: homeassistant
    baseTopic: hlc
    commands: true                # кнопки WoL / shutdown / reboot

# ─── Машины ────────────────────────────────────────────────────────────────
# Общие поля: name, ip, mac (для WoL). Остальное — секции модулей;
# нет секции — хост в модуле не участвует.
#   agent       HomeLabControlAgent: порт, ОС, ключ API (apiKey — один для HLC и Home Assistant).
#               Ключ генерирует и прописывает деплой.
#   power       Power Control (WoL/ping; shutdown/reboot — только при наличии agent)
#   fanControl  Fan Control (нужен agent)
#   smart       SMART Monitor (нужен agent)
#   backup      Backup Manager (SSH-бэкап)
hosts:
  - name: nas
    ip: 192.168.1.20
    mac: AA:BB:CC:00:00:20
    agent:
      port: 8117
      os: linux
    power:
      defaultDelaySeconds: 1
    fanControl:
      ignoredSensors:
        - nct6798/AUXTIN2
        - nct6798/AUXTIN4
    smart: {}

  - name: desktop
    ip: 192.168.1.10
    mac: AA:BB:CC:00:00:10
    agent:
      port: 8117
      os: windows
    power:
      defaultDelaySeconds: 20
    fanControl: {}
    smart: {}

  - name: gate-router
    ip: 192.168.1.1
    backup:
      sshPort: 22
      user: root
      sshKey: /root/.ssh/gate_router_key
      direction: push             # push — роутер сам заливает на storage; pull — storage забирает с роутера
      template: OpenWrt Full
      storage: remote-server
      schedule: "0 3 * * *"       # пока не используется — планировщика бэкапов нет
      enabled: true

# ─── Деплой агента ─────────────────────────────────────────────────────────
# Сборки агента вшиты в образ (/app/agent/<rid>); sourcePath — только без них.
deploy:
  sshKeyPath: config/hlc_deploy_ed25519   # SSH-ключ HLC, создаётся автоматически
  linux:
    homeLabControlAgent:
      installPath: /srv/homeLabControlAgent
      executableName: HomeLabControlAgent
  windows:
    homeLabControlAgent:
      installPath: d:\apps\homeLabControlAgent
      executableName: HomeLabControlAgent.exe
