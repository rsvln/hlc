name: Build and push Docker image

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: version
        run: |
          echo "version=$(tr -d '[:space:]' < HomeLabControl/version.txt)" >> $GITHUB_OUTPUT
          echo "agent=$(tr -d '[:space:]' < HomeLabControlAgent/version.txt)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Образ: HomeLabControl + self-contained сборки агента (linux-x64, win-x64 с ShutdownDialog)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./HomeLabControl/Dockerfile
          push: true
          tags: |
            ghcr.io/rsvln/hlc:latest
            ghcr.io/rsvln/hlc:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/rsvln/hlc
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Один релиз на версию: создаётся при первом push нового HomeLabControl/version.txt, дальше пропускается
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          AGENT: ${{ steps.version.outputs.agent }}
        run: |
          TAG="v$VERSION"
          git fetch --tags --quiet
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          cat > notes.md <<EOF
          HomeLabControl **$VERSION**, bundled HomeLabControlAgent **$AGENT**.

          ### Docker image

          \`\`\`bash
          docker pull ghcr.io/rsvln/hlc:$VERSION
          \`\`\`

          After updating the container, update agents on **Config → Agents → Update all**.
          EOF
          gh release create "$TAG" --title "HomeLabControl $TAG" --notes-file notes.md --generate-notes --latest
