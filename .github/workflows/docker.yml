name: Build and push Docker image

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: version
        run: |
          echo "version=$(tr -d '[:space:]' < HomeLabControl/version.txt)" >> $GITHUB_OUTPUT
          echo "agent=$(tr -d '[:space:]' < HomeLabControlAgent/version.txt)" >> $GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: |
          dotnet test HomeLabControlAgent.Tests -c Release
          dotnet test HomeLabControl.Tests -c Release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Образ: HomeLabControl + self-contained сборки агента (linux-x64, win-x64 с ShutdownDialog)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./HomeLabControl/Dockerfile
          push: true
          tags: |
            ghcr.io/rsvln/hlc:latest
            ghcr.io/rsvln/hlc:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/rsvln/hlc
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Self-contained сборки сервера и агента — прикрепляются к релизу
      - name: Builds for install without Docker
        env:
          VERSION: ${{ steps.version.outputs.version }}
          AGENT: ${{ steps.version.outputs.agent }}
        run: |
          mkdir -p dist
          dotnet publish HomeLabControlAgent/HomeLabControlAgent.csproj -c Release -r linux-x64 --self-contained true -o dist/agent/linux-x64
          dotnet publish HomeLabControlAgent/HomeLabControlAgent.csproj -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -o dist/agent/win-x64
          for rid in linux-x64 win-x64; do
            dotnet publish HomeLabControl/HomeLabControl.csproj -c Release -r $rid --self-contained true -p:EnableWindowsTargeting=true -o dist/server/$rid
            cp -r dist/agent dist/server/$rid/agent
          done
          tar -czf "dist/HomeLabControlAgent-$AGENT-linux-x64.tar.gz" -C dist/agent/linux-x64 .
          (cd dist/agent/win-x64 && zip -qr "../../HomeLabControlAgent-$AGENT-win-x64.zip" .)
          tar -czf "dist/HomeLabControl-$VERSION-linux-x64.tar.gz" -C dist/server/linux-x64 .
          (cd dist/server/win-x64 && zip -qr "../../HomeLabControl-$VERSION-win-x64.zip" .)

      # Один релиз на версию: создаётся при первом push нового HomeLabControl/version.txt, дальше пропускается
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          AGENT: ${{ steps.version.outputs.agent }}
        run: |
          TAG="v$VERSION"
          git fetch --tags --quiet
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # Текст релиза: release-notes/<версия>.md (если есть), затем как поставить.
          # Нет файла — автоматический список коммитов с прошлого тега.
          NOTES_FILE="release-notes/$VERSION.md"
          {
            echo "HomeLabControl **$VERSION**, bundled HomeLabControlAgent **$AGENT**."
            echo
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
              echo
            fi
            cat <<EOF
          ### Docker image

          \`\`\`bash
          docker pull ghcr.io/rsvln/hlc:$VERSION
          \`\`\`

          After updating the container, update agents on **Config → Agents → Update all**.

          ### Without Docker

          Unpack \`HomeLabControl-$VERSION-<os>\` below and run \`install.cmd\` (Windows) or \`sudo sh install.sh\` (Linux).

          ### Agent for manual install

          Unpack \`HomeLabControlAgent-$AGENT-<os>\` below and run \`install.cmd\` (Windows) or \`sudo sh install.sh\` (Linux),
          then register it on **Config → Agents → Add existing**.
          EOF
          } > notes.md

          # Релиз уже есть (повторный push той же версии): обновляем только текст, если для версии есть заметки
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file notes.md
              echo "Release $TAG exists — notes updated from $NOTES_FILE"
            else
              echo "Release $TAG already exists"
            fi
            exit 0
          fi

          GENERATE=""
          [ -f "$NOTES_FILE" ] || GENERATE="--generate-notes"
          gh release create "$TAG" --title "HomeLabControl $TAG" --notes-file notes.md $GENERATE --latest \
            "dist/HomeLabControlAgent-$AGENT-linux-x64.tar.gz" "dist/HomeLabControlAgent-$AGENT-win-x64.zip" \
            "dist/HomeLabControl-$VERSION-linux-x64.tar.gz" "dist/HomeLabControl-$VERSION-win-x64.zip"
